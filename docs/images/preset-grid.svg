<text x="24" y="58" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#57606a">Each cell: position as the pedal shows it, and the 0-based index openvave also accepts (preset select 6 = 2C).</text>
