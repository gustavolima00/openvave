<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-labelledby="t d">
<title id="t">The 36 Tank-G presets: 9 banks by 4 slots</title>
<desc id="d">Presets 1A to 9D. Index = 4 times (bank minus 1) plus slot, 0 to 35. Global byte 1 holds bank minus 1, global byte 2 the slot 0 to 3.</desc>
