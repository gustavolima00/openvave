<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" role="img" aria-labelledby="t d">
<title id="t">The Tank-G effect chain as the app draws it</title>
<desc id="d">Six blocks in order: GATE, AMP, MOD, DLY, RVB, CAB, with the preset bytes of each. The order audio is processed in has not been verified.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect width="860" height="320" rx="14" fill="#f6f5f1"/>
<text x="24" y="36" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2328">Effect chain: six blocks</text>
<text x="24" y="58" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#57606a">In the order the phone app draws them, which is also the order of preset bytes 4–17.</text>
<text x="24" y="174" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">IN</text>
<line x1="42" y1="170" x2="61" y2="170" stroke="#57606a" stroke-width="2" marker-end="url(#ar)"/>
<rect x="64" y="90" width="112" height="160" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="120.0" y="114" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f2328" letter-spacing="2">GATE</text>
<text x="120.0" y="136" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#0b5cad">noise_gate 4</text>
<text x="120.0" y="152" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#0b5cad"></text>
<text x="120.0" y="232" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606a">no switch</text>
<line x1="178" y1="170" x2="185" y2="170" stroke="#57606a" stroke-width="2" marker-end="url(#ar)"/>
<rect x="188" y="90" width="112" height="160" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="244.0" y="114" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f2328" letter-spacing="2">AMP</text>
<text x="244.0" y="136" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#0b5cad">amp_type 5</text>
<text x="244.0" y="152" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#0b5cad">gain 6</text>
<text x="244.0" y="168" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#0b5cad">treble 7</text>
<text x="244.0" y="184" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#0b5cad">middle 8</text>
<text x="244.0" y="200" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#0b5cad">bass 9</text>
<text x="244.0" y="216" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#0b5cad">volume 10</text>
<text x="244.0" y="232" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606a">switch: amp_on 0</text>
<line x1="302" y1="170" x2="309" y2="170" stroke="#57606a" stroke-width="2" marker-end="url(#ar)"/>
<rect x="312" y="90" width="112" height="160" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="368.0" y="114" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f2328" letter-spacing="2">MOD</text>
<text x="368.0" y="136" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#0b5cad">mod_fx 11 ★</text>
<text x="368.0" y="152" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#0b5cad">mod_speed 12</text>
<text x="368.0" y="232" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606a">switch: mod_on 1</text>
<line x1="426" y1="170" x2="433" y2="170" stroke="#57606a" stroke-width="2" marker-end="url(#ar)"/>
<rect x="436" y="90" width="112" height="160" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="492.0" y="114" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f2328" letter-spacing="2">DLY</text>
<text x="492.0" y="136" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#0b5cad">delay_mix 13 ★</text>
<text x="492.0" y="152" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#0b5cad">delay_time 14</text>
<text x="492.0" y="232" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606a">switch: delay_on 2</text>
<line x1="550" y1="170" x2="557" y2="170" stroke="#57606a" stroke-width="2" marker-end="url(#ar)"/>
<rect x="560" y="90" width="112" height="160" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="616.0" y="114" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f2328" letter-spacing="2">RVB</text>
<text x="616.0" y="136" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#0b5cad">reverb_decay 15 ★</text>
<text x="616.0" y="152" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#0b5cad">reverb_mix 16</text>
<text x="616.0" y="232" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606a">switch: reverb_on 3</text>
<line x1="674" y1="170" x2="681" y2="170" stroke="#57606a" stroke-width="2" marker-end="url(#ar)"/>
<rect x="684" y="90" width="112" height="160" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="740.0" y="114" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f2328" letter-spacing="2">CAB</text>
<text x="740.0" y="136" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#0b5cad">ir_cab 17</text>
<text x="740.0" y="152" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#0b5cad"></text>
<text x="740.0" y="232" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606a">no switch</text>
<line x1="798" y1="170" x2="816" y2="170" stroke="#57606a" stroke-width="2" marker-end="url(#ar)"/>
<text x="820" y="174" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">OUT</text>
<text x="24" y="284" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">Unverified: the order in which the pedal processes audio. Many modellers put the cabinet right after the amp;</text>
<text x="24" y="302" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">nothing in the protocol says where the Tank-G puts it.  ★ typed knob: three types along the sweep (effect-types.md).</text>
</svg>
