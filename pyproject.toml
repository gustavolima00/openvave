[project]
name = "openvave"
version = "0.3.0"
description = "Read-only client library and CLI for the M-VAVE Tank-G pedal (BLE). Unofficial. Not affiliated with or endorsed by M-VAVE / Cuvave."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["bleak>=0.22"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]

[project.scripts]
openvave = "openvave.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "jsonschema>=4.23", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openvave"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "hardware: needs a real Tank-G; runs only with --hardware",
  "persistent_writes: the test may send stored-slot, commit and stored-image writes (spec 004)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["specs", ".specify"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
